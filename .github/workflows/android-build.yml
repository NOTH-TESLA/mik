name: Build MikroTik Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MikroTikManager-Android-Source.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          test -f MikroTikManager-Android-Source.zip
          unzip -q MikroTikManager-Android-Source.zip -d .
          test -f MikroTikManager/settings.gradle.kts
          test -f MikroTikManager/app/build.gradle.kts

      - name: Build debug APK
        working-directory: MikroTikManager
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Manager-debug-apk
          path: MikroTikManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
